name: CI - Security Scan

on:
  push:
    branches:
      - 'cadenzaflow-v1.0.0'
  pull_request:
    branches:
      - 'cadenzaflow-v1.0.0'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: cadenzaflow-release-parent
  APP_VERSION: "1.0.0"
  MAIL_TO: ali.aras@pia-team.com
  SMTP_SERVER: mail-eu.smtp2go.com
  SMTP_PORT: "2525"

jobs:
  security-scan:
    runs-on: cadenzaflow-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Security: Trivy FS Scan ---
      - name: Trivy filesystem scan
        id: trivy_fs
        uses: ./.github/actions/trivy-scan
        with:
          scan_type: fs
          scan_target: .
          severity: HIGH,CRITICAL
          output_file: trivy-fs-report.json
          skip_dirs: .git,.github

      # --- Security Report: PDF + Mail ---
      - name: Generate security report and send mail
        if: always()
        uses: ./.github/actions/security-report
        with:
          app_name: ${{ env.APP_NAME }}
          version: ${{ env.APP_VERSION }}
          environment: dev
          trivy_fs_report: ${{ steps.trivy_fs.outputs.report_path }}
          mail_to: ${{ env.MAIL_TO }}
          smtp_server: ${{ env.SMTP_SERVER }}
          smtp_port: ${{ env.SMTP_PORT }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
